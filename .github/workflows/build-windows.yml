# Builds EmailBot.exe on a Windows machine at GitHub.
# - Every push to main: the .exe is attached to the run as "EmailBot-windows"
#   (Actions tab -> the run -> Artifacts).
# - Pushing a tag like v1.0.0: the .exe is also attached to a GitHub Release.
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the Release for a tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Email Bot's add-ons and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1

      - name: Build EmailBot.exe
        run: pyinstaller EmailBot.spec

      - name: Check the .exe contains everything
        run: dist\EmailBot.exe --check-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: EmailBot-windows
          path: dist/EmailBot.exe

      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EmailBot.exe
